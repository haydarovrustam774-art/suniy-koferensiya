<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konferensiya Ishtirokchilari</title>
  <style>
    /* Umumiy fon va 3D muhit */
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      font-size: 3em;
      margin-bottom: 50px;
      text-shadow: 2px 4px 10px rgba(0,0,0,0.3);
    }
    
    /* Loader (Kutish oynasi) */
    #loader { text-align: center; font-size: 1.5em; font-weight: bold; }

    /* Kartochkalar uchun Grid tizimi */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
      perspective: 1000px; /* 3D effekt uchun asosiy muhit */
    }

    /* 3D Kartochka dizayni (Glassmorphism) */
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      transition: transform 0.5s ease, box-shadow 0.5s ease;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    /* 3D Hover effekti - Sishqoncha borganda qiyshayib oldinga chiqadi */
    .card:hover {
      transform: translateZ(30px) rotateX(10deg) rotateY(-10deg);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    /* Kartochka ichidagi matnlar 3D bo'lib bo'rtib chiqishi uchun */
    .card-content {
      transform: translateZ(40px); /* Matnni kartadan yuqoriga ko'tarish */
    }

    .fish { font-size: 1.5em; font-weight: bold; color: #ffdf00; margin: 0 0 10px 0; }
    .guruh { font-size: 1.1em; color: #a8c0ff; margin: 5px 0; }
    .mavzu { font-size: 1.2em; margin: 15px 0; font-style: italic; line-height: 1.4; }
    .yonalish {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.9em;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Konferensiya Ishtirokchilari</h1>
  <div id="loader">Ma'lumotlar bazadan yuklanmoqda...</div>
  <div class="grid-container" id="ishtirokchilar-royxati"></div>

  <script>
    // GOOGLE APPS SCRIPT HAVOLASINI SHU YERGA QO'YING:
    const API_URL = "https://script.google.com/macros/s/AKfycby8BpzxQ6mqVX8Pt7AmiGYV4_lHuOOAISvoQdkl74S-egKzWWZr25F6b-c0k4d7zOSd/exec";

    // Sahifa yuklanganda ma'lumotlarni tortib kelish
    fetch(API_URL)
      .then(response => response.json())
      .then(data => {
        document.getElementById('loader').style.display = 'none'; // Loaderni yashirish
        const container = document.getElementById('ishtirokchilar-royxati');
        
        // Agar baza bo'sh bo'lsa
        if(data.length === 0) {
          container.innerHTML = "<h3>Hozircha ishtirokchilar yo'q.</h3>";
          return;
        }

        // Har bir ishtirokchi uchun 3D kartochka yaratish
        data.reverse().forEach(ishtirokchi => {
          // data.reverse() eng oxirgi ro'yxatdan o'tganlarni birinchi ko'rsatadi
          const cardHTML = `
            <div class="card">
              <div class="card-content">
                <h2 class="fish">${ishtirokchi.fish}</h2>
                <p class="guruh">🎓 Guruh: ${ishtirokchi.guruh}</p>
                <p class="mavzu">📝 Mavzu: "${ishtirokchi.mavzu}"</p>
                <span class="yonalish">📌 ${ishtirokchi.yonalish}</span>
              </div>
            </div>
          `;
          container.innerHTML += cardHTML;
        });
      })
      .catch(error => {
        document.getElementById('loader').innerHTML = "Xatolik yuz berdi. Internetni yoki API havolani tekshiring.";
      });
  </script>

</body>
</html>
